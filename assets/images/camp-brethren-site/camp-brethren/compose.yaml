services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/inquiries.sqlite
      BACKUP_DIRECTORY: /app/backups
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - elite-academy-data:/app/data
      - elite-academy-backups:/app/backups
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  elite-academy-data:
  elite-academy-backups:
